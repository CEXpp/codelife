services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: codelife-backend
    ports:
      - "8788:8788"
    environment:
      - PORT=8788
      - CODELIFE_LLM_BASE_URL=${CODELIFE_LLM_BASE_URL:-https://api.deepseek.com/v1}
      - CODELIFE_LLM_API_KEY=${CODELIFE_LLM_API_KEY:-}
      - CODELIFE_LLM_MODEL=${CODELIFE_LLM_MODEL:-deepseek-chat}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: codelife-frontend
    ports:
      - "5188:80"
    depends_on:
      - backend
    restart: unless-stopped
